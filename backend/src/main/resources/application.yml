server:
  port: 8080
spring:
  application:
    name: tms
  datasource:
    url: jdbc:h2:file:./data/tms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  h2:
    console:
      enabled: true
      path: /h2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
logging:
  level:
    com.tms: info
tms:
  open:
    api-key: ${TMS_OPEN_API_KEY:tms-open-key}
  bms:
    mode: ${TMS_BMS_MODE:mock}
    base-url: ${TMS_BMS_URL:http://localhost:8084}
    api-key: ${TMS_BMS_API_KEY:bms-open-key}
  oms:
    mode: ${TMS_OMS_MODE:mock}
    base-url: ${TMS_OMS_URL:http://localhost:8081}
    api-key: ${TMS_OMS_API_KEY:oms-open-key}
  express:
    mode: ${TMS_EXPRESS_MODE:mock}
    base-url: ${TMS_EXPRESS_URL:}
    api-key: ${TMS_EXPRESS_API_KEY:}
